name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include command, adapter, versions, and logs with secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

